appId: com.sndevelopment.snagentsos
productName: SnAgentsOS
copyright: Copyright © 2026 Valentin Tarnovsky

directories:
  output: release/${version}
  buildResources: build

asar: true
# node-pty ships a native .node addon that must live outside the asar archive.
asarUnpack:
  - '**/node_modules/node-pty/**'

files:
  - out/**
  - package.json

# Tray icon, copied next to the app so the main process can load it at runtime.
extraResources:
  - from: build/icon.png
    to: icon.png
  # MIT notices of adapted third-party code ship with every copy (R21-00).
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md

# node-pty is N-API (ABI-stable) and ships prebuilt binaries that load in
# Electron directly, so no native rebuild is needed (and avoids requiring a
# C++ toolchain). asarUnpack keeps the .node files loadable on disk.
npmRebuild: false

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-setup.${ext}
  # GUID of the 1.x installs: keeps a single entry in Apps and lets the setup
  # run the old uninstaller. build/installer.nsh moves the app out of the old
  # folder (E0-FR-15).
  guid: 8c5f793e-c93a-5e95-add6-ae90c4af8c04
  include: build/installer.nsh

portable:
  artifactName: ${productName}-${version}-portable.${ext}
  # Stable extraction path so the exe Windows Firewall sees does not change
  # per release; without it every update re-triggers the firewall prompt for
  # the embedded remote-control server.
  unpackDirName: SnAgentsOS

mac:
  category: public.app-category.developer-tools
  # Signing / notarization are out of scope for the OSS v1.
  identity: null
  hardenedRuntime: false
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]

linux:
  category: Development
  maintainer: Valentin Tarnovsky <tarnovskyvalentin@gmail.com>
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
